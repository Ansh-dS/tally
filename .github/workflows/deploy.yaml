name: Production Deployment

on:
  push:
    branches:
      - main # Or your active deployment branch like feat-ai-summary

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Cluster over SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Target the correct home location directory created by User Data
            cd /home/ubuntu/tally

            # 2. Safe check: Initialize git if the folder is completely empty
            if [ ! -d ".git" ]; then
              echo "Initializing Git repository clone..."
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # 3. Pull the absolute freshest changes safely
            git fetch --all
            git reset --hard origin/main

            # 4. Inject the production configuration payload 
            echo "${{ secrets.PRODUCTION_ENV_FILE }}" > .env

            # 5. Build and wake up the containers (No sudo needed for GitHub's fresh terminal session!)
            docker compose --profile prod up -d --build

            # 6. Housekeeping: Prune older build caches to keep your upgraded storage clean
            docker image prune -f
