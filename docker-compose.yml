# 1. dockerFile (text document):  it runs some terminal commands which we mentioned , like we run a file while booting a operating system?
#2. each container runs any software which  want to keep separate from your main computer
#3. docker-compose.yml: it make networking b/w multiple containers at once.

services:
  postgres:
    image: postgres:15-alpine
    container_name: tally-postgres
    restart: always # Only starts when YOU manually type docker-compose up
    environment:
      POSTGRES_USER: ${POSTGRES_USER} # ${xyz}: env.process.POSTGRES_USER
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tallydb
    ports:
      # 127.0.0.1 is a special reserved loopback address that prevents external network requests from hitting the data layer directly.
      # if we don't provide "DB_PORT_BINDING" our HOST i.p gets 0.0.0.0.
      - '${DB_PORT_BINDING:-127.0.0.1:5432}:5432'
    # volumes: you can stop the container, restart your computer, or even update the Postgres image, and your forms/users(data) won't be deleted.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tally-network
  redis:
    image: redis:7-alpine
    container_name: tally-redis
    restart: always # but for production use always. no means: don't start the server until use "docker compose up"
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    ports:
      # 127.0.0.1 is a special reserved loopback address that prevents external network requests from hitting the data layer directly.
      - '${REDIS_PORT_BINDING:-127.0.0.1:6379}:6379'
    volumes:
      - redis_data:/data # Official defined by the image itself.
    networks:
      - tally-network

  # --- PRODUCTION ONLY CONTAINERS BELOW ---
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tally-web
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tally-postgres:5432/tallydb?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@tally-redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - tally-network
    profiles:
      - prod # This hides the container from local development!

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tally-worker
    restart: always
    command: pnpm worker:prod
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tally-postgres:5432/tallydb?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@tally-redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - tally-network
    profiles:
      - prod # This hides the container from local development!

volumes:
  postgres_data:
  redis_data:

networks:
  tally-network: # only tally inside containers can able to see each other.
    driver: bridge
